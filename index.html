@media print {

    counter-increment: page;
  }

  body {
    background: #fff;
    font-family: Arial, sans-serif;

    padding: 8px;
    text-align: left;

  }

  th {

    color: white !important;

  }

  thead {
    display: table-header-group;
  }

    page-break-inside: avoid;

  }

  .no-print,
  input,
  button,
  select,
  .btn,
  #editControls {
    display: none !important;
  }

  .page-number::after {
    content: "Page " counter(page);
    position: fixed;
    bottom: 10px;
    right: 20px;
    font-size: 12px;
    color: #333;
  }

  }

  }
}

}

.slider {

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: 0.4s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 4px;
  bottom: 3px;
  background-color: white;
  transition: 0.4s;
  border-radius: 50%;
}

   let currentEpicSl = null;
    const headers = [
      "Timestamp", "Email address", "Form Number", "Epic Id No", "Part Number",
      "Epic Sl. Number", "Name", "Father's Name", "Mother's Name", "Gender",
      "Date of Birth", "Age", "Religion", "Blood Group", "Phone Number", "Email Id",
      "Address", "Residence At", "Residence As", "Ward No", "Floor No", "Landlord Name",
      "Marriage Status", "Marriage Date", "Occupation", "Service Type", "Employee",

    function performSearch() {
  const query = document.getElementById('searchBox').value.trim();
  const column = document.getElementById('columnSelect').value;

  if (!query) {
    alert("Please enter a value.");
    return;
  }

  google.script.run.withSuccessHandler(function(results) {
    const container = document.getElementById('results');
    container.innerHTML = "";

    // ❌ No results
    if (results.length === 0) {
      container.textContent = "❓ No results found.";
      currentEpicSl = null;

      // 🔒 Hide all UI controls
      document.getElementById("checkboxContainer").style.display = "none";
      document.getElementById("editControls").style.display = "none";
      document.getElementById("sortButton").style.display = "none";
      document.getElementById("uploadButton").style.display = "none";
      return;
    }

    // ✅ Create result table
    const table = document.createElement("table");
    table.id = "resultsTable";

    if (results.length === 1) {
      const epicSlIndex = headers.indexOf("Epic Sl. Number");
      currentEpicSl = results[0][epicSlIndex];

      const tbody = document.createElement("tbody");
      results[0].forEach((cell, i) => {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.textContent = headers[i];
        const td = document.createElement("td");

        if (headers[i] === "Image Link" || headers[i] === "Document") {
          td.innerHTML = formatFileList(cell);
        } else {
          td.textContent = cell;
        }

        tr.appendChild(th);
        tr.appendChild(td);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    } else {
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      headers.forEach(header => {
        const th = document.createElement("th");
        th.textContent = header;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      results.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach((cell, i) => {
          const td = document.createElement("td");
          if (headers[i] === "Image Link" || headers[i] === "Document") {
            td.innerHTML = formatFileList(cell);
          } else {
            td.textContent = cell;
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      currentEpicSl = null;
    }

    container.appendChild(table);

    // ✅ Show required buttons and controls
    document.getElementById("checkboxContainer").style.display = "block";
    document.getElementById("editControls").style.display = "block";
    document.getElementById("sortButton").style.display = "inline-block";
    document.getElementById("uploadButton").style.display = "inline-block";
    document.getElementById("dataAnalysisButton").style.display = "inline-block";

    renderCheckboxes(headers);

  }).searchInColumns(column, query);
}

   function formatFileList(data) {
  if (!data) return '';

  return data.split('\n').map((link, i) => {
    const isImage = link.includes("/view");
    const fileIdMatch = link.match(/\/d\/(.*?)\//);
    const fileId = fileIdMatch ? fileIdMatch[1] : null;

    if (!fileId) return `${i + 1}. <a href="${link}" target="_blank">Unknown File</a>`;

    const thumbnail = `https://drive.google.com/thumbnail?id=${fileId}`;

    if (link.includes(".jpg") || link.includes(".png") || link.includes(".jpeg")) {
      return `${i + 1}. 🖼️ <a href="${link}" target="_blank">
        <img src="${thumbnail}" height="60" style="vertical-align:middle; margin-right:8px;">
        ${extractFileName(link)}
      </a>`;
    } else {
      return `${i + 1}. 📄 <a href="${link}" target="_blank">${extractFileName(link)}</a>`;
    }
  }).join('<br>');
}

function extractFileName(link) {
  try {
    const url = new URL(link);
    return decodeURIComponent(url.pathname.split('/').pop().replace(/_/g, ' '));
  } catch {
    return 'File';
  }
}

    function clearSearch() {

  // ❌ Hide all controls when search is cleared
  document.getElementById("checkboxContainer").style.display = "none";
  document.getElementById("editControls").style.display = "none";

  document.getElementById("redoButton").style.display = "none";
  document.getElementById("undoButton").style.display = "none";
}

    let sortEnabled = false;

function makeTableSortable() {
  const table = document.querySelector("#results table");
  const sortBtn = document.getElementById("sortButton");
  if (!table || !sortBtn) return;

  const headers = table.querySelectorAll("th");

  if (sortEnabled) {
    headers.forEach(th => th.onclick = null);
    sortEnabled = false;
    sortBtn.classList.remove("sort-on");
    sortBtn.classList.add("sort-off");
    return;
  }

  headers.forEach((th, index) => {
    let asc = true;
    th.style.cursor = "pointer";
    th.onclick = () => {
      const rows = Array.from(table.querySelectorAll("tbody tr"));
      rows.sort((a, b) => {
        const cellA = a.children[index].textContent.trim();
        const cellB = b.children[index].textContent.trim();
        return asc
          ? cellA.localeCompare(cellB, undefined, { numeric: true })
          : cellB.localeCompare(cellA, undefined, { numeric: true });
      });
      const tbody = table.querySelector("tbody");
      rows.forEach(row => tbody.appendChild(row));
      asc = !asc;
    };
  });

  sortEnabled = true;
  sortBtn.classList.remove("sort-off");
  sortBtn.classList.add("sort-on");
}

    function showUploadModal() {
  document.getElementById("uploadModal").style.display = "block";
  document.getElementById("overlay").style.display = "block";
}

function closeUploadModal() {
  document.getElementById("uploadModal").style.display = "none";
  document.getElementById("overlay").style.display = "none";
}

function uploadFile() {
  const files = document.getElementById("fileInput").files;

  if (!files || files.length === 0) {
    alert("Please select at least one file.");
    return;
  }

  if (!currentEpicSl) {
    alert("Please search a record before uploading.");
    return;
  }

  document.getElementById("loading").style.display = "block";

  let uploadedCount = 0;
  let failedCount = 0;

  Array.from(files).forEach((file, index) => {
    const reader = new FileReader();
    reader.onload = function (e) {
      const base64 = e.target.result.split(",")[1];
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          uploadedCount++;
        } else {
          failedCount++;
        }

        if (uploadedCount + failedCount === files.length) {
          document.getElementById("loading").style.display = "none";
          closeUploadModal();
          performSearch();
          showToast(`✅ ${uploadedCount} uploaded, ❌ ${failedCount} failed`, failedCount > 0 ? 'error' : 'success');
        }
      }).uploadFiles({
        base64: base64,
        fileName: file.name,
        mimeType: file.type,
        epicSl: currentEpicSl.trim()
      });
    };
    reader.readAsDataURL(file);
  });
}

function renderCheckboxes(columns) {
  const container = document.getElementById('checkboxContainer');
  container.innerHTML = '<button class="uncheck-btn" onclick="uncheckAll()">🗑️ Uncheck All</button>';
  container.style.display = 'block';

  columns.forEach(col => {
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = false; // default unchecked
    checkbox.setAttribute('data-colname', col);

    checkbox.onchange = function () {
      applyColumnVisibility(); // Apply visibility when checkbox is changed
    };

    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(col));
    container.appendChild(label);
  });

  // Apply default visibility (all visible)
  applyColumnVisibility();
}

function applyColumnVisibility() {
  const checkboxes = document.querySelectorAll('#checkboxContainer input[type="checkbox"]');
  const table = document.querySelector("#results table");
  if (!table) return;

  const rows = table.rows;
  const isVertical = [...rows].every(row => row.cells.length === 2); // 2-column: key-value

  const anyChecked = [...checkboxes].some(cb => cb.checked);

  if (isVertical) {
    // ✅ VERTICAL VIEW (2-column key-value): Hide/show rows
    for (let row of rows) {
      const key = row.cells[0]?.textContent.trim();
      const checkbox = [...checkboxes].find(cb => cb.getAttribute('data-colname') === key);
      if (!anyChecked || (checkbox && checkbox.checked)) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    }

  } else {
    // ✅ HORIZONTAL VIEW (with header): Hide/show columns
    const headerRow = table.rows[0]; // assumes first row is header
    const colMap = {};
    [...headerRow.cells].forEach((cell, index) => {
      colMap[cell.textContent.trim()] = index;
    });

    // First hide all if any checkbox is selected
    for (let row of rows) {
      for (let cell of row.cells) {
        cell.style.display = anyChecked ? 'none' : '';
      }
    }

    // Show selected columns only
    if (anyChecked) {
      checkboxes.forEach(cb => {
        if (!cb.checked) return;
        const colName = cb.getAttribute('data-colname');
        const colIndex = colMap[colName];
        if (colIndex === undefined) return;

        for (let row of rows) {
          if (row.cells[colIndex]) {
            row.cells[colIndex].style.display = '';
          }
        }
      });
    }
  }
}

function uncheckAll() {
  const checkboxes = document.querySelectorAll('#checkboxContainer input[type="checkbox"]');
  checkboxes.forEach(cb => cb.checked = false);
  applyColumnVisibility(); // Reset view
}

function toggleEditMode() {
  const password = document.getElementById("editPassword").value;
  const editButton = document.querySelector('button[onclick="toggleEditMode()"]');

  if (!editEnabled) {
    // Validate password via Apps Script
    google.script.run.withSuccessHandler(function(valid) {
      if (!valid) {
        alert("❌ Incorrect password.");
        return;
      }

      enableEdit(true);

      // ✅ Change text and button color to green (editing on)
      editButton.textContent = "🔒 Editing ON";
      editButton.classList.remove("off");
      editButton.classList.add("on");

      document.getElementById("editPassword").value = "";
    }).validatePassword(password);
  } else {
    enableEdit(false);

    // ✅ Change text and button color back to blue (editing off)
    editButton.textContent = "✏️ Edit Mode";
    editButton.classList.remove("on");
    editButton.classList.add("off");
  }
}

// ✅ ENABLE OR DISABLE EDIT MODE
function enableEdit(enable) {
  editEnabled = enable;

  document.getElementById("saveChanges").style.display = enable ? "inline-block" : "none";
  document.getElementById("deleteButton").style.display = enable ? "inline-block" : "none";

  const table = document.querySelector("#resultsTable");
  if (!table) return;

  for (let r = 1; r < table.rows.length; r++) {
    for (let c = 0; c < table.rows[r].cells.length; c++) {
      table.rows[r].cells[c].contentEditable = enable;
    }
  }

  // Optional: Add/editable class to highlight rows
  if (enable) {
    table.classList.add("editable");
    table.classList.remove("read-only");
  } else {
    table.classList.remove("editable");
    table.classList.add("read-only");
  }
}

// ✅ SAVE
function saveEditedData() {
  const table = document.querySelector("#resultsTable");
  if (!table || table.rows.length < 2) {
    alert("❌ No record selected or table not found.");
    return;
  }

  const headers = Array.from(table.rows[0].cells).map(c => c.textContent.trim());
  const values = Array.from(table.rows[1].cells).map(c => c.textContent.trim());
  const data = {};
  headers.forEach((key, i) => data[key] = values[i]);

  if (!data["Epic Sl. Number"]) {
    alert("❌ 'Epic Sl. Number' is required.");
    return;
  }

  google.script.run.withSuccessHandler(response => {
    showToast(response, response.startsWith("✅") ? "success" : "error");
    if (response.startsWith("✅")) performSearch();
  }).saveEditedData(data);
}

// ✅ DELETE
function confirmDelete() {
  const table = document.querySelector("#resultsTable");
  if (!table || table.rows.length < 2) {
    alert("❌ No record selected.");
    return;
  }

  const index = Array.from(table.rows[0].cells).findIndex(c => c.textContent === "Epic Sl. Number");
  const epic = table.rows[1].cells[index]?.textContent.trim();

  if (!epic || !confirm(`Delete record for Epic Sl. Number: ${epic}?`)) return;

  google.script.run.withSuccessHandler(res => {
    showToast(res, res.startsWith("✅") ? "success" : "error");
    if (res.startsWith("✅")) {
      document.getElementById("results").innerHTML = "";
      document.getElementById("checkboxContainer").style.display = "none";
    }
  }).deleteRecordByEpic(epic);
}

// ✅ UNDO/REDO
function undo() {
  const action = undoStack.pop();
  if (!action) return;
  const table = document.querySelector("#resultsTable");
  action.data.forEach(({ rowIndex, colIndex, value }) => {
    table.rows[rowIndex].cells[colIndex].innerText = value;
  });
  redoStack.push(action);
}

function redo() {
  const action = redoStack.pop();
  if (!action) return;
  const table = document.querySelector("#resultsTable");
  const reverseData = [];
  action.data.forEach(({ rowIndex, colIndex, value }) => {
    reverseData.push({ rowIndex, colIndex, value: table.rows[rowIndex].cells[colIndex].innerText });
    table.rows[rowIndex].cells[colIndex].innerText = "";
  });
  undoStack.push({ type: "clear", data: reverseData });
}

function printRecord() {
  const profileImg = window.userProfileImgURL || "https://via.placeholder.com/80";
  const logoImg = window.userOrgLogoURL || "https://via.placeholder.com/150";
  const table = document.querySelector("#results table");

  if (!table) {
    alert("❌ Nothing to print.");
    return;
  }

  const newWin = window.open('', '_blank');
  const doc = newWin.document;

  doc.write(`
    <html>
      <head>
        <title>Print View</title>
        <style>
          @page {
            size: select;
            margin: 1cm;
          }

          body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #fff;
          }

          .print-header {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Ensure center alignment */
            margin-bottom: 20px;
          }

          .print-header img.logo {
            height: 55px;
            width: auto;
            object-fit: contain;
            display: block; /* Make sure logo is block */
            margin-right: 20px; /* Give spacing between logo and profile */
          }

          .print-header img.profile {
            height: 60px;
            width: 60px;
            object-fit: cover;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: block;
          }

          table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            page-break-inside: auto;
          }

          th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            vertical-align: top;
            word-wrap: break-word;
          }

          th {
            background-color: #333;
            color: white;
            font-weight: bold;
          }

          thead {
            display: table-header-group;
          }

          tr {
            page-break-inside: avoid;
          }

          .page-number::after {
            content: "Page " counter(page);
            position: fixed;
            bottom: 10px;
            right: 20px;
            font-size: 12px;
            color: #333;
          }

          @media screen {
            .print-header {
              display: none;
            }
          }
        </style>
      </head>
      <body>
        <div class="print-header">
          <img class="logo" src="${logoImg}" alt="Logo" />
          <img class="profile" src="${profileImg}" alt="Profile" />
        </div>
        ${table.outerHTML}
      </body>
    </html>
  `);

  doc.close();
  newWin.focus();
  newWin.print();
  newWin.close();
}

function toggleTheme() {
  document.body.classList.toggle("night");

  // Optional: Store preference in localStorage
  const isNight = document.body.classList.contains("night");
  localStorage.setItem("theme", isNight ? "night" : "day");
}

// Optional: Load saved theme on startup
window.onload = () => {
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "night") {
    document.getElementById("themeToggle").checked = true;
    document.body.classList.add("night");
  }
};

// Function to toggle charts visibility
    function toggleAnalysis() {
      const container = document.getElementById("chartsContainer");
      const chartBtn = document.querySelector('button[onclick="toggleAnalysis()"]');

      if (!container || !chartBtn) return;

      const isVisible = container.style.display === "block";
      container.style.display = isVisible ? "none" : "block";

      // ✅ Color toggle
      chartBtn.style.backgroundColor = isVisible ? "#007bff" : "#17a2b8"; // blue ↔ teal

      if (!isVisible) {
        google.script.run.withSuccessHandler(drawCharts).getChartData();
      }
    }

    // Function to draw charts once data is fetched
    function drawCharts(data) {
      // Gender Pie Chart
      const genderCtx = document.getElementById('genderChart').getContext('2d');
      new Chart(genderCtx, {
        type: 'pie',
        data: {
          labels: Object.keys(data.gender),
          datasets: [{
            data: Object.values(data.gender),
            backgroundColor: ['#36A2EB', '#FF6384'],
          }]
        }
      });

      // Collector's Choice Bar Chart
      const choiceCtx = document.getElementById('choiceChart').getContext('2d');
      new Chart(choiceCtx, {
        type: 'bar',
        data: {
          labels: Object.keys(data.choice),
          datasets: [{
            label: 'Choices',
            data: Object.values(data.choice),
            backgroundColor: '#4CAF50',
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });

      // Display Gender-wise Choice Counts
      const genderChoiceContainer = document.getElementById("genderChoiceContainer");
      genderChoiceContainer.innerHTML = "<h2>Gender-wise Collector's Choice Count</h2>";

      Object.keys(data.choiceByGender).forEach(choice => {
        const maleCount = data.choiceByGender[choice].Male || 0;
        const femaleCount = data.choiceByGender[choice].Female || 0;
        const choiceDiv = document.createElement('div');
        choiceDiv.innerHTML = `<strong>${choice}:</strong> Male: ${maleCount}, Female: ${femaleCount}`;
        genderChoiceContainer.appendChild(choiceDiv);
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('https://partha881.github.io/samadhan-pwa/sw.js')
        .then(() => console.log('✅ Service Worker registered'))
        .catch(err => console.error('❌ SW registration failed:', err));
    }

let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;

  // Show your install button now
  document.getElementById('installBtn').style.display = 'block';

  document.getElementById('installBtn').addEventListener('click', () => {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choiceResult => {
      if (choiceResult.outcome === 'accepted') {
        console.log('User accepted the install prompt');
      } else {
        console.log('User dismissed the install prompt');
      }
      deferredPrompt = null;
      document.getElementById('installBtn').style.display = 'none';
    });
  });
});


function changePassword() {
    const oldPwd = document.getElementById('oldPassword').value.trim();
    const newPwd = document.getElementById('newPassword').value.trim();
    if (!oldPwd || !newPwd) {
      alert("Please fill both password fields.");
      return;
    }
    google.script.run.withSuccessHandler(res => {
      document.getElementById('changePasswordMsg').textContent = res.message;
      if (res.success) {
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
      }
    }).changePassword(oldPwd, newPwd);
  }
